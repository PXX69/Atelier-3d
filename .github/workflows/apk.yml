name: APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Construire l'APK
        run: |
          mkdir -p build/www
          cp -r index.html manifest.webmanifest sw.js lib icons build/www/
          cd build
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7
          npx cap init "Atelier 3D" io.github.pxx69.atelier3d --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../atelier-3d.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Atelier 3D pour Android
          body: Fichier d'installation Android (version de test).
          files: atelier-3d.apk
